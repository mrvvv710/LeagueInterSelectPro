<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inter Select Pro</title>
</head>
<body>
<script>
function dropCard(html, id) {
  var token = "playSiteVideo(this,'" + id + "')";
  var i = html.indexOf(token);
  while (i !== -1) {
    var from = html.lastIndexOf("<div", i);
    var pos = from, depth = 0, end = -1;
    while (pos < html.length) {
      var open = html.indexOf("<div", pos);
      var close = html.indexOf("</div>", pos);
      if (close === -1) break;
      if (open !== -1 && open < close) { depth++; pos = open + 4; }
      else {
        depth--;
        pos = close + 6;
        if (depth === 0) { end = pos; break; }
      }
    }
    if (from < 0 || end < 0 || end - from > 1200) break;
    html = html.slice(0, from) + html.slice(end);
    i = html.indexOf(token);
  }
  return html;
}
fetch("https://raw.githubusercontent.com/mrvvv710/LeagueInterSelectPro/1bac70fedfbee5824ec27146943557881d026d45/index.html")
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    html = dropCard(html, "2mdQpYh0n94");
    html = dropCard(html, "in0WbN8VBm8");
    document.open();
    document.write(html);
    document.close();
    var scripts = document.querySelectorAll("script");
    scripts.forEach(function(old){
      if (old.src) return;
      var s = document.createElement("script");
      s.text = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  })
  .catch(function(){ document.body.textContent = "Не удалось загрузить страницу."; });
</script>
</body>
</html>
