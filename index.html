<body>
<script>
function cutDiv(html, start) {
  var i = html.indexOf(start);
  while (i !== -1) {
    var pos = i, depth = 0, end = -1;
    while (pos < html.length) {
      var open = html.indexOf("<div", pos);
      var close = html.indexOf("</div>", pos);
      if (close === -1) break;
      if (open !== -1 && open < close) { depth++; pos = open + 4; }
      else { depth--; pos = close + 6; if (depth === 0) { end = pos; break; } }
    }
    if (end === -1) break;
    html = html.slice(0, i) + html.slice(end);
    i = html.indexOf(start);
  }
  return html;
}
fetch("https://raw.githubusercontent.com/mrvvv710/LeagueInterSelectPro/1bac70fedfbee5824ec27146943557881d026d45/index.html")
  .then(function(r){ return r.text(); })
  .then(function(html){
    ["2mdQpYh0n94", "in0WbN8VBm8"].forEach(function(id){
      html = cutDiv(html, '<div class="vslot" onclick="playSiteVideo(this,\'' + id + '\')">');
      html = cutDiv(html, '<div class="gal-card" onclick="playSiteVideo(this,\'' + id + '\')">');
    });
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(){ document.body.textContent = "Не удалось загрузить страницу."; });
</script>
